name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint et types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Tests unitaires et d'intégration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dedale
          POSTGRES_PASSWORD: dedale
          POSTGRES_DB: dedale_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dedale" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://dedale:dedale@localhost:5432/dedale_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Moteur, contrats, i18n, jetons, API (Postgres réel), web (Vitest), mobile (Jest).
      - run: pnpm test

  e2e:
    name: Parcours de bout en bout (builds de production)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dedale
          POSTGRES_PASSWORD: dedale
          POSTGRES_DB: dedale
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dedale" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: production
      DATABASE_URL: postgres://dedale:dedale@localhost:5432/dedale
      AUTH_SECRET: ci-secret-uniquement-pour-les-tests-0123456789
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      API_INTERNAL_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DEMO_MODE: 'true'
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@dedale/api --filter=@dedale/web
      - name: Base de données (migrations + données de démonstration)
        run: |
          node apps/api/dist/migrate.mjs
          node apps/api/dist/seed.mjs --reset
      - name: Démarrer l'API et le site
        run: |
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public
          nohup node apps/api/dist/main.mjs > api.log 2>&1 &
          PORT=3000 nohup node apps/web/.next/standalone/apps/web/server.js > web.log 2>&1 &
          for url in http://localhost:4000/health http://localhost:3000/robots.txt; do
            timeout 60 bash -c "until curl -sf $url > /dev/null; do sleep 1; done"
          done
      - run: pnpm --filter @dedale/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        run: tail -n 200 api.log web.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  mobile:
    name: Bundles mobiles (iOS, Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vérifie que Metro résout tout le monorepo et produit le bytecode Hermes.
      - run: pnpm --filter @dedale/mobile bundle:check

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality]
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: false
          tags: dedale/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
